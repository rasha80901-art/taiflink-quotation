  return html;
}

fetch(ORIGINAL,{cache:'no-store'})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(src){document.open();document.write(apply(src));document.close();})
.catch(function(){var e=document.getElementById('err');if(e)e.style.display='block';});
})();
